[package]
name = "ephemeral-ml-smoke-test"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
license = "Apache-2.0"
description = "Phase 1 BYOC end-to-end smoke test. Runs doctor preflight, launches the Cyntrisec enclave, runs a synthetic inference, verifies the AIR v1 receipt offline, writes the evidence bundle to S3."
repository = "https://github.com/cyntrisec/EphemeralML"
homepage = "https://ephemeralml.cyntrisec.com"

[[bin]]
name = "ephemeralml-smoke-test"
path = "src/main.rs"

[dependencies]
clap = { workspace = true, features = ["derive"] }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
async-trait = { workspace = true }
chrono = { workspace = true, features = ["serde"] }
sha2 = { workspace = true }
uuid = { workspace = true }
hex = { workspace = true }

# Stage 5 S3 upload for the evidence bundle.
aws-config = { workspace = true }
aws-sdk-s3 = { version = "1.132.0", default-features = false, features = ["behavior-version-latest", "rt-tokio", "default-https-client", "http-1x", "sigv4a"] }
aws-sdk-ssm = { version = "1.55", default-features = false, features = ["behavior-version-latest", "rt-tokio", "default-https-client"] }

[dev-dependencies]
assert_cmd = "2.2"
predicates = "3.1"
