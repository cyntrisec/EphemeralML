[package]
name = "cyntrisec-relay-egress"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "Nitro parent-side KMS and S3 egress helper for Cyntrisec workers"

[[bin]]
name = "cyntrisec-relay-egress"
path = "src/main.rs"

[[bin]]
name = "cyntrisec-worker-config"
path = "src/bin/cyntrisec_worker_config.rs"

[dependencies]
tokio = { workspace = true }
tokio-vsock = { workspace = true }
clap = { workspace = true, features = ["derive", "env"] }
tracing = { workspace = true }
tracing-subscriber = { workspace = true, features = ["env-filter", "json"] }
serde_json = { workspace = true }
aws-config = { workspace = true }
aws-sdk-kms = { version = "1.106.0", default-features = false, features = ["behavior-version-latest", "rt-tokio", "default-https-client"] }
aws-sdk-s3 = { version = "1.132.0", default-features = false, features = ["behavior-version-latest", "rt-tokio", "default-https-client", "http-1x", "sigv4a"] }
ephemeral-ml-common = { path = "../../common" }
