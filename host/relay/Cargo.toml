[package]
name = "cyntrisec-relay"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "Byte relay between TCP/NLB and Nitro Enclave vsock"

[[bin]]
name = "cyntrisec-relay"
path = "src/main.rs"

[dependencies]
tokio = { workspace = true }
tokio-vsock = { workspace = true }
clap = { workspace = true, features = ["derive", "env"] }
tracing = { workspace = true }
tracing-subscriber = { workspace = true, features = ["env-filter", "json"] }

[dev-dependencies]
tokio = { workspace = true }
