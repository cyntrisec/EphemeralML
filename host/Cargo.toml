[package]
name = "ephemeral-ml-host"
version = "0.2.9"
edition = "2021"
license = "Apache-2.0"
default-run = "ephemeral-ml-host"
autobins = false

[dependencies]
# Workspace dependencies
ephemeral-ml-common = { path = "../common" }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
anyhow = { workspace = true }
rand = { workspace = true }
ciborium = { workspace = true }
hpke = { workspace = true, features = ["std", "x25519"] }

# Host-specific dependencies
tokio-vsock = { workspace = true, optional = true }
aws-config = { workspace = true }
aws-sdk-kms = { version = "1.103.0", default-features = false, features = ["behavior-version-latest", "rt-tokio", "default-https-client"] }
aws-sdk-s3 = { version = "1.132.0", default-features = false, features = ["behavior-version-latest", "rt-tokio", "default-https-client", "http-1x", "sigv4a"] }
aws-types = "1.3.14"
async-trait = { workspace = true }
sha2 = { workspace = true }
hex = { workspace = true }
confidential-ml-transport = { workspace = true }
confidential-ml-pipeline = { workspace = true }
bytes = { workspace = true }
clap = { workspace = true, features = ["derive", "env"] }

# Observability (v1)
tracing = { workspace = true }
tracing-subscriber = { workspace = true, features = ["env-filter", "json"] }

[features]
default = ["mock"]
mock = ["confidential-ml-transport/mock", "confidential-ml-transport/tcp", "confidential-ml-pipeline/mock", "confidential-ml-pipeline/tcp"]
production = ["tokio-vsock", "confidential-ml-transport/vsock", "confidential-ml-transport/nitro", "confidential-ml-pipeline/vsock", "confidential-ml-transport/tcp", "confidential-ml-pipeline/tcp"]
gcp = ["confidential-ml-transport/tdx", "confidential-ml-transport/tcp", "confidential-ml-pipeline/tcp"]
debug-tools = []

[[bin]]
name = "ephemeral-ml-host"
path = "src/main.rs"

[[bin]]
name = "kms_proxy_host"
path = "src/bin/kms_proxy_host.rs"

[[bin]]
name = "spy_host"
path = "src/bin/spy_host.rs"
required-features = ["debug-tools"]
