[package]
name = "ephemeralml-verifier-api"
version = "0.2.9"
edition = "2021"
license = "Apache-2.0"
description = "Hosted verification API for EphemeralML attested execution receipts"

[[bin]]
name = "ephemeralml-verifier"
path = "src/main.rs"

[dependencies]
ephemeral-ml-common = { path = "../common" }
ephemeral-ml-client = { path = "../client" }

# Web framework
axum = { version = "0.8", features = ["json", "multipart"] }
tokio = { workspace = true }
tower-http = { version = "0.6", features = ["cors", "trace", "limit", "set-header"] }

# Serialization
serde = { workspace = true }
serde_json = { workspace = true }

# Crypto
ed25519-dalek = { workspace = true }
hex = { workspace = true }
base64 = "0.22"
sha2 = { workspace = true }
uuid = { workspace = true }

# Logging
tracing = { workspace = true }
tracing-subscriber = { workspace = true, features = ["env-filter"] }

# CLI
clap = { workspace = true, features = ["derive", "env"] }

[dev-dependencies]
reqwest = { version = "0.13", features = ["json", "multipart"] }
rand = { workspace = true }
tokio = { workspace = true, features = ["test-util"] }
