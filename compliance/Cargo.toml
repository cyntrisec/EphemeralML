[package]
name = "ephemeral-ml-compliance"
version = "0.2.9"
edition = "2021"
license = "Apache-2.0"
description = "Compliance evidence bundle generation and verification for EphemeralML"

[dependencies]
ephemeral-ml-common = { path = "../common" }
serde = { workspace = true }
serde_json = { workspace = true }
ciborium = { workspace = true }
ed25519-dalek = { workspace = true }
sha2 = { workspace = true }
hex = { workspace = true }
thiserror = { workspace = true }
chrono = { workspace = true, features = ["serde"] }
uuid = { workspace = true }
clap = { workspace = true, features = ["derive"] }
rand = { workspace = true }

[dev-dependencies]
# Tests use the common crate's types directly

[[bin]]
name = "ephemeralml-compliance"
path = "src/bin/compliance_cli.rs"
