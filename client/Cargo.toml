[package]
name = "ephemeral-ml-client"
version = "0.2.9"
edition = "2021"
license = "Apache-2.0"

[dependencies]
# Workspace dependencies
ephemeral-ml-common = { path = "../common", features = [] }

serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
uuid = { workspace = true }
sha2 = { workspace = true }

# Client-specific dependencies
ciborium = { workspace = true }
clap = { workspace = true, features = ["derive"] }
reqwest = { version = "0.13", features = ["json"] }
hex = { workspace = true }
serde_bytes = { workspace = true }
ed25519-dalek = { workspace = true }
base64 = "0.22.1"
async-trait = { workspace = true }
jsonwebtoken = { version = "10.4", optional = true, features = ["aws_lc_rs"] }
coset = { workspace = true }
x509-parser = { workspace = true }
openssl = { workspace = true }
rand = { workspace = true }
# Client always needs transport mock (client is not in a TEE) and tcp.
confidential-ml-transport = { workspace = true, features = ["mock", "tcp"] }
bytes = { workspace = true }
tracing-subscriber = { workspace = true, features = ["env-filter"] }

[dev-dependencies]
rand = { workspace = true }

[features]
default = []
vendored-openssl = ["openssl/vendored"]
# Application-level mock: MockSecureClient, --allow-mock flag, mock attestation bridge.
# Transport-level mock (MockProvider for client handshake) is always available via base dep.
mock = []
production = []
gcp = ["confidential-ml-transport/tdx", "jsonwebtoken"]

[[bin]]
name = "ephemeralml-verify"
path = "src/bin/ephemeralml_verify.rs"

[[bin]]
name = "cyntrisec-verify"
path = "src/bin/cyntrisec_verify.rs"

[[bin]]
name = "ephemeralml-report"
path = "src/bin/ephemeralml_report.rs"

[[bin]]
name = "ephemeralml-runtime-passport"
path = "src/bin/ephemeralml_runtime_passport.rs"

[[bin]]
name = "ephemeralml"
path = "src/bin/ephemeralml.rs"
