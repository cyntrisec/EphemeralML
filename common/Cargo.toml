[package]
name = "ephemeral-ml-common"
version = "0.2.9"
edition = "2021"
license = "Apache-2.0"

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
async-trait = { workspace = true }
thiserror = { workspace = true }
uuid = { workspace = true }
sha2 = { workspace = true }
hex = { workspace = true }

# Cryptographic dependencies
ed25519-dalek = { workspace = true }
rand = { workspace = true }
zeroize = { workspace = true }

# CBOR serialization
ciborium = { workspace = true }
coset = { workspace = true }

# Confidential ML transport
confidential-ml-transport = { workspace = true, features = ["tcp"] }
bytes = { workspace = true }
tokio = { workspace = true, features = ["io-util"] }

# Lazy initialization
lazy_static = "1.4"

# Serde bytes for efficient byte array serialization
serde_bytes = { workspace = true }

# Optional ML dependencies (only for benchmark binaries via "inference" feature)
candle-core = { workspace = true, optional = true }
candle-nn = { workspace = true, optional = true }
candle-transformers = { workspace = true, optional = true }
tokenizers = { workspace = true, optional = true }

[dev-dependencies]
proptest = { workspace = true }

[features]
default = []
inference = ["candle-core", "candle-nn", "candle-transformers", "tokenizers"]
mock = []
