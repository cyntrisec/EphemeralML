[package]
name = "ephemeralml-gateway"
version = "0.1.0"
edition = "2021"
description = "OpenAI-compatible HTTP gateway for EphemeralML confidential inference"
license = "Apache-2.0"

[[bin]]
name = "ephemeralml-gateway"
path = "src/main.rs"

[[bin]]
name = "cyntrisec-proxy"
path = "src/bin/cyntrisec_proxy.rs"

[dependencies]
ephemeral-ml-client = { path = "../client" }
ephemeral-ml-common = { path = "../common" }
confidential-ml-transport = { workspace = true, features = ["tcp"] }
bytes = { workspace = true }

# Web framework
axum = { version = "0.8", features = ["json"] }
tokio = { workspace = true }
tower-http = { version = "0.6", features = ["cors", "trace", "limit"] }
futures = "0.3"
async-trait = { workspace = true }

# Serialization
serde = { workspace = true }
serde_json = { workspace = true }

# Crypto / hashing
sha2 = { workspace = true }
hex = { workspace = true }

# Logging
tracing = { workspace = true }
tracing-subscriber = { workspace = true, features = ["env-filter"] }

# CLI
clap = { workspace = true, features = ["derive", "env"] }

# Utilities
uuid = { workspace = true }
anyhow = { workspace = true }
rand = { workspace = true }
dashmap = "6"
base64 = "0.22"

[features]
default = []
mock = ["ephemeral-ml-client/mock", "confidential-ml-transport/mock"]
gcp = ["ephemeral-ml-client/gcp"]
production = ["ephemeral-ml-client/production", "confidential-ml-transport/nitro"]

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
ephemeral-ml-enclave = { path = "../enclave", features = ["mock"] }
cyntrisec-relay-egress = { path = "../host/relay-egress" }
flate2 = "1.0"
tar = "0.4"
