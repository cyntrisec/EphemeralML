name: Cluster A Image Release

on:
  push:
    tags:
      - 'cluster-a-v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'OCI tag to publish, for example v1.5'
        type: string
        default: 'v1.5'
      push:
        description: 'Push to ECR Public and cosign-sign published references'
        type: boolean
        default: false
      publish_oci_artifacts:
        description: 'Build and publish OCI artifacts; disable for template-only signing'
        type: boolean
        default: true
      build_enclave_eif:
        description: 'Run Nitro EIF build on a self-hosted Nitro runner'
        type: boolean
        default: false
      publish_template_to_s3:
        description: 'Upload the signed worker template bundle to the release S3 bucket'
        type: boolean
        default: true

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: us-east-1
  ECR_PUBLIC_REGISTRY: public.ecr.aws
  ECR_PUBLIC_NAMESPACE: f4z4g3i5
  TEMPLATE_BUCKET: cyntrisec-public-templates-us-east-1
  TEMPLATE_PREFIX: aws

jobs:
  release-tag:
    name: Resolve Release Tag
    runs-on: ubuntu-22.04
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      template_tag: ${{ steps.tag.outputs.template_tag }}
      push: ${{ steps.mode.outputs.push }}
      publish_oci_artifacts: ${{ steps.mode.outputs.publish_oci_artifacts }}
      build_enclave_eif: ${{ steps.mode.outputs.build_enclave_eif }}
      publish_template_to_s3: ${{ steps.mode.outputs.publish_template_to_s3 }}
    steps:
      - name: Resolve tag
        id: tag
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            RAW_TEMPLATE_TAG="${GITHUB_REF_NAME}"
          else
            RAW_TEMPLATE_TAG="${{ inputs.release_tag }}"
          fi

          case "$RAW_TEMPLATE_TAG" in
            cluster-a-*) TEMPLATE_TAG="${RAW_TEMPLATE_TAG#cluster-a-}" ;;
            *) TEMPLATE_TAG="$RAW_TEMPLATE_TAG" ;;
          esac
          if ! printf '%s\n' "$TEMPLATE_TAG" | grep -Eq '^v[0-9]+(\.[0-9]+)*$'; then
            echo "invalid template tag: $TEMPLATE_TAG (expected v<major>[.<minor>...], e.g. v1.5.1)" >&2
            exit 2
          fi

          if [ "${GITHUB_EVENT_NAME}" = "push" ] && [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            if printf '%s\n' "$TEMPLATE_TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
              TAG="$(printf '%s\n' "$TEMPLATE_TAG" | sed -E 's/^v([0-9]+\.[0-9]+)\.[0-9]+$/v\1/')"
            else
              TAG="$TEMPLATE_TAG"
            fi
          else
            RAW_TAG="${{ inputs.release_tag }}"
            case "$RAW_TAG" in
              cluster-a-*) TAG="${RAW_TAG#cluster-a-}" ;;
              *) TAG="$RAW_TAG" ;;
            esac
          fi
          if ! printf '%s\n' "$TAG" | grep -Eq '^v[0-9]+(\.[0-9]+)*$'; then
            echo "invalid release tag: $TAG (expected v<major>[.<minor>...], e.g. v1 or v1.5)" >&2
            exit 2
          fi
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ] && [ "${{ inputs.push }}" = "true" ] && [ "${{ inputs.publish_template_to_s3 }}" != "false" ] && [ "${GITHUB_REF_TYPE}" != "tag" ]; then
            echo "publishing a signed template requires dispatching from a release tag ref, e.g. --ref cluster-a-v1.5.1" >&2
            exit 2
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "template_tag=$TEMPLATE_TAG" >> "$GITHUB_OUTPUT"

      - name: Resolve publish mode
        id: mode
        env:
          TEMPLATE_TAG: ${{ steps.tag.outputs.template_tag }}
        run: |
          if [ "${GITHUB_EVENT_NAME}" = "push" ] && [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            echo "push=true" >> "$GITHUB_OUTPUT"
            echo "publish_template_to_s3=true" >> "$GITHUB_OUTPUT"
            if printf '%s\n' "$TEMPLATE_TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
              echo "publish_oci_artifacts=false" >> "$GITHUB_OUTPUT"
              echo "build_enclave_eif=false" >> "$GITHUB_OUTPUT"
            else
              echo "publish_oci_artifacts=true" >> "$GITHUB_OUTPUT"
              echo "build_enclave_eif=true" >> "$GITHUB_OUTPUT"
            fi
            exit 0
          fi

          if [ "${{ inputs.push }}" = "true" ]; then
            echo "push=true" >> "$GITHUB_OUTPUT"
          else
            echo "push=false" >> "$GITHUB_OUTPUT"
          fi
          if [ "${{ inputs.publish_oci_artifacts }}" != "false" ]; then
            echo "publish_oci_artifacts=true" >> "$GITHUB_OUTPUT"
          else
            echo "publish_oci_artifacts=false" >> "$GITHUB_OUTPUT"
          fi
          if [ "${{ inputs.publish_template_to_s3 }}" != "false" ]; then
            echo "publish_template_to_s3=true" >> "$GITHUB_OUTPUT"
          else
            echo "publish_template_to_s3=false" >> "$GITHUB_OUTPUT"
          fi
          if [ "${{ inputs.build_enclave_eif }}" = "true" ]; then
            echo "build_enclave_eif=true" >> "$GITHUB_OUTPUT"
          else
            echo "build_enclave_eif=false" >> "$GITHUB_OUTPUT"
          fi

  host-binaries:
    name: Build Host Binary (${{ matrix.repository }})
    runs-on: ubuntu-22.04
    needs: release-tag
    if: needs.release-tag.outputs.publish_oci_artifacts == 'true'
    environment: production-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - repository: relay
            package: cyntrisec-relay
            binaries: cyntrisec-relay
          - repository: relay-egress
            package: cyntrisec-relay-egress
            binaries: cyntrisec-relay-egress cyntrisec-worker-config
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.93.0

      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends pkg-config libssl-dev

      - name: Build binaries
        run: cargo build --locked --release -p ${{ matrix.package }} --bins

      - name: Stage binary artifact
        env:
          BINARIES: ${{ matrix.binaries }}
        run: |
          set -euo pipefail
          mkdir -p "dist/${{ matrix.repository }}"
          for binary in $BINARIES; do
            cp "target/release/${binary}" "dist/${{ matrix.repository }}/${binary}"
            (cd "dist/${{ matrix.repository }}" && sha256sum "${binary}" > "${binary}.sha256")
          done

      - name: Configure AWS credentials
        if: needs.release-tag.outputs.push == 'true'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_RELEASE_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: cluster-a-image-release-${{ github.run_id }}

      - name: Login to ECR Public
        if: needs.release-tag.outputs.push == 'true'
        uses: aws-actions/amazon-ecr-login@v2
        with:
          registry-type: public

      - name: Verify ECR Public namespace
        if: needs.release-tag.outputs.push == 'true'
        run: |
          set -euo pipefail
          aliases="$(aws ecr-public describe-registries --query 'registries[].aliases[].name' --output text)"
          printf 'ECR Public aliases: %s\n' "$aliases"
          printf '%s\n' "$aliases" | tr '\t' '\n' | grep -Fx "$ECR_PUBLIC_NAMESPACE" >/dev/null

      - name: Install ORAS
        if: needs.release-tag.outputs.push == 'true'
        uses: oras-project/setup-oras@v1

      - name: Install cosign
        if: needs.release-tag.outputs.push == 'true'
        uses: sigstore/cosign-installer@v3
        with:
          cosign-release: 'v2.4.1'

      - name: Ensure ECR Public repository exists
        if: needs.release-tag.outputs.push == 'true'
        env:
          REPOSITORY: ${{ matrix.repository }}
        run: |
          set -euo pipefail
          if ! aws ecr-public describe-repositories --repository-names "$REPOSITORY" >/dev/null 2>&1; then
            aws ecr-public create-repository --repository-name "$REPOSITORY" >/dev/null
          fi

      - name: Push and sign host binary OCI artifact
        id: publish
        if: needs.release-tag.outputs.push == 'true'
        env:
          REF: ${{ env.ECR_PUBLIC_REGISTRY }}/${{ env.ECR_PUBLIC_NAMESPACE }}/${{ matrix.repository }}:${{ needs.release-tag.outputs.tag }}
          BINARIES: ${{ matrix.binaries }}
        run: |
          set -euo pipefail
          args=()
          for binary in $BINARIES; do
            args+=("dist/${{ matrix.repository }}/${binary}:application/vnd.cyntrisec.executable.linux-amd64")
            args+=("dist/${{ matrix.repository }}/${binary}.sha256:text/plain")
          done
          oras push "$REF" "${args[@]}"
          DIGEST="$(oras resolve "$REF")"
          cosign sign --yes "$REF@$DIGEST"
          echo "oci_digest=$DIGEST" >> "$GITHUB_OUTPUT"

      - name: Emit host binary manifest
        env:
          REPOSITORY: ${{ matrix.repository }}
          BINARIES: ${{ matrix.binaries }}
          TAG: ${{ needs.release-tag.outputs.tag }}
          PUSHED: ${{ needs.release-tag.outputs.push }}
          OCI_DIGEST: ${{ steps.publish.outputs.oci_digest }}
        run: |
          set -euo pipefail
          mkdir -p dist/release-manifests
          checksums_json="$(
            for binary in $BINARIES; do
              checksum="$(cut -d ' ' -f1 "dist/${REPOSITORY}/${binary}.sha256")"
              printf '"%s":"%s"\n' "$binary" "$checksum"
            done | jq -Rs 'split("\n")[:-1] | map(split(":")) | map({(.[0] | fromjson): (.[1] | fromjson)}) | add'
          )"
          binaries_json="$(printf '%s\n' $BINARIES | jq -R . | jq -s .)"
          cat > "dist/release-manifests/${REPOSITORY}.json" <<JSON
          {
            "schema_version": 1,
            "kind": "host_binary",
            "repository": "${ECR_PUBLIC_REGISTRY}/${ECR_PUBLIC_NAMESPACE}/${REPOSITORY}",
            "tag": "${TAG}",
            "binaries": ${binaries_json},
            "file_sha256": ${checksums_json},
            "oci_digest": "${OCI_DIGEST}",
            "pushed": ${PUSHED}
          }
          JSON

      - name: Upload host binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: cluster-a-host-binary-${{ matrix.repository }}
          path: |
            dist/${{ matrix.repository }}/*
            dist/release-manifests/${{ matrix.repository }}.json
          retention-days: 30

  proxy-image:
    name: Build Proxy OCI Image
    runs-on: ubuntu-22.04
    needs: release-tag
    if: needs.release-tag.outputs.publish_oci_artifacts == 'true'
    environment: production-release
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Configure AWS credentials
        if: needs.release-tag.outputs.push == 'true'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_RELEASE_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: cluster-a-proxy-release-${{ github.run_id }}

      - name: Login to ECR Public
        if: needs.release-tag.outputs.push == 'true'
        uses: aws-actions/amazon-ecr-login@v2
        with:
          registry-type: public

      - name: Verify ECR Public namespace
        if: needs.release-tag.outputs.push == 'true'
        run: |
          set -euo pipefail
          aliases="$(aws ecr-public describe-registries --query 'registries[].aliases[].name' --output text)"
          printf 'ECR Public aliases: %s\n' "$aliases"
          printf '%s\n' "$aliases" | tr '\t' '\n' | grep -Fx "$ECR_PUBLIC_NAMESPACE" >/dev/null

      - name: Ensure ECR Public repository exists
        if: needs.release-tag.outputs.push == 'true'
        run: |
          set -euo pipefail
          if ! aws ecr-public describe-repositories --repository-names proxy >/dev/null 2>&1; then
            aws ecr-public create-repository --repository-name proxy >/dev/null
          fi

      - name: Build proxy image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/release/images/Dockerfile.proxy
          load: ${{ needs.release-tag.outputs.push != 'true' }}
          push: ${{ needs.release-tag.outputs.push == 'true' }}
          provenance: ${{ needs.release-tag.outputs.push == 'true' }}
          sbom: ${{ needs.release-tag.outputs.push == 'true' }}
          tags: |
            ${{ env.ECR_PUBLIC_REGISTRY }}/${{ env.ECR_PUBLIC_NAMESPACE }}/proxy:${{ needs.release-tag.outputs.tag }}

      - name: Resolve proxy image reference
        id: image
        env:
          IMAGE: ${{ env.ECR_PUBLIC_REGISTRY }}/${{ env.ECR_PUBLIC_NAMESPACE }}/proxy:${{ needs.release-tag.outputs.tag }}
          PUSHED: ${{ needs.release-tag.outputs.push }}
          PUSHED_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          if [ "$PUSHED" = "true" ]; then
            echo "digest=$PUSHED_DIGEST" >> "$GITHUB_OUTPUT"
            echo "sign_ref=$IMAGE@$PUSHED_DIGEST" >> "$GITHUB_OUTPUT"
          else
            LOCAL_ID="$(docker image inspect --format='{{.Id}}' "$IMAGE")"
            echo "digest=$LOCAL_ID" >> "$GITHUB_OUTPUT"
            echo "sign_ref=" >> "$GITHUB_OUTPUT"
          fi

      - name: Install cosign
        if: needs.release-tag.outputs.push == 'true'
        uses: sigstore/cosign-installer@v3
        with:
          cosign-release: 'v2.4.1'

      - name: Cosign-sign pushed proxy image
        if: needs.release-tag.outputs.push == 'true'
        env:
          IMAGE_REF: ${{ steps.image.outputs.sign_ref }}
        run: cosign sign --yes "$IMAGE_REF"

      - name: Emit proxy image manifest
        run: |
          mkdir -p dist/release-manifests
          cat > "dist/release-manifests/proxy.json" <<JSON
          {
            "schema_version": 1,
            "kind": "oci_image",
            "repository": "${{ env.ECR_PUBLIC_REGISTRY }}/${{ env.ECR_PUBLIC_NAMESPACE }}/proxy",
            "tag": "${{ needs.release-tag.outputs.tag }}",
            "digest": "${{ steps.image.outputs.digest }}",
            "pushed": ${{ needs.release-tag.outputs.push == 'true' }}
          }
          JSON

      - name: Upload proxy image manifest
        uses: actions/upload-artifact@v4
        with:
          name: cluster-a-image-proxy
          path: dist/release-manifests/proxy.json
          retention-days: 30

  worker-template:
    name: Sign Worker CloudFormation Template
    runs-on: ubuntu-22.04
    needs: release-tag
    environment: production-release
    steps:
      - uses: actions/checkout@v4

      - name: Install cfn-lint
        run: python -m pip install --user cfn-lint==1.49.3

      - name: Verify template pins the release tag
        env:
          TAG: ${{ needs.release-tag.outputs.tag }}
        run: |
          set -euo pipefail
          template_default="$(
            awk '
              /^  ReleaseTag:/ { in_release_tag = 1 }
              in_release_tag && /Default:/ { print $2; exit }
            ' deploy/aws/v1/worker.yaml
          )"
          if [ "$template_default" != "$TAG" ]; then
            printf 'worker.yaml ReleaseTag default mismatch: expected %s, got %s\n' "$TAG" "$template_default" >&2
            exit 1
          fi
          # cfn-lint's IAM action table can lag ECR Public pull actions used by
          # ORAS/cosign on AL2023. Keep structural linting strict and ignore
          # only that known action-list warning.
          "$HOME/.local/bin/cfn-lint" -i W3037 -- deploy/aws/v1/worker.yaml

      - name: Stage worker template
        id: stage-template
        env:
          TEMPLATE_TAG: ${{ needs.release-tag.outputs.template_tag }}
        run: |
          set -euo pipefail
          mkdir -p dist/worker-template dist/release-manifests
          cp deploy/aws/v1/worker.yaml dist/worker-template/worker.yaml
          (cd dist/worker-template && sha256sum worker.yaml > worker.yaml.sha256)
          template_sha256="$(cut -d ' ' -f1 dist/worker-template/worker.yaml.sha256)"
          versioned_key="${TEMPLATE_PREFIX}/${TEMPLATE_TAG}/worker.yaml"
          latest_key="${TEMPLATE_PREFIX}/latest/worker.yaml"
          s3_url="https://s3.${AWS_REGION}.amazonaws.com/${TEMPLATE_BUCKET}/${versioned_key}"
          mirror_url="https://templates.cyntrisec.com/${versioned_key}"
          {
            echo "sha256=${template_sha256}"
            echo "versioned_key=${versioned_key}"
            echo "latest_key=${latest_key}"
            echo "s3_url=${s3_url}"
            echo "mirror_url=${mirror_url}"
          } >> "$GITHUB_OUTPUT"

      - name: Install cosign
        if: needs.release-tag.outputs.push == 'true'
        uses: sigstore/cosign-installer@v3
        with:
          cosign-release: 'v2.4.1'

      - name: Sign worker template blob
        if: needs.release-tag.outputs.push == 'true'
        run: |
          set -euo pipefail
          cosign sign-blob \
            --yes \
            --bundle dist/worker-template/worker.yaml.cosign.bundle \
            --output-signature dist/worker-template/worker.yaml.sig \
            --output-certificate dist/worker-template/worker.yaml.cert \
            dist/worker-template/worker.yaml

      - name: Configure AWS credentials for template publish
        if: needs.release-tag.outputs.push == 'true' && needs.release-tag.outputs.publish_template_to_s3 == 'true'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_RELEASE_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: cluster-a-template-release-${{ github.run_id }}

      - name: Publish worker template bundle to S3
        id: publish-template
        if: needs.release-tag.outputs.push == 'true' && needs.release-tag.outputs.publish_template_to_s3 == 'true'
        env:
          RELEASE_TAG: ${{ needs.release-tag.outputs.tag }}
          TEMPLATE_TAG: ${{ needs.release-tag.outputs.template_tag }}
          TEMPLATE_SHA256: ${{ steps.stage-template.outputs.sha256 }}
          VERSIONED_KEY: ${{ steps.stage-template.outputs.versioned_key }}
          LATEST_KEY: ${{ steps.stage-template.outputs.latest_key }}
        run: |
          set -euo pipefail
          aws --version
          immutable_cache='public, max-age=31536000, immutable'
          latest_cache='no-cache, must-revalidate'
          metadata="release-tag=${RELEASE_TAG},template-tag=${TEMPLATE_TAG},sha256=${TEMPLATE_SHA256}"

          put_pair() {
            local label="$1"
            local file="$2"
            local suffix="$3"
            local content_type="$4"
            local versioned_id latest_id
            versioned_id="$(
              aws s3api put-object \
                --bucket "$TEMPLATE_BUCKET" \
                --key "${VERSIONED_KEY}${suffix}" \
                --body "$file" \
                --content-type "$content_type" \
                --cache-control "$immutable_cache" \
                --metadata "$metadata" \
                --query VersionId \
                --output text
            )"
            latest_id="$(
              aws s3api put-object \
                --bucket "$TEMPLATE_BUCKET" \
                --key "${LATEST_KEY}${suffix}" \
                --body "$file" \
                --content-type "$content_type" \
                --cache-control "$latest_cache" \
                --metadata "$metadata" \
                --query VersionId \
                --output text
            )"
            printf '%s\t%s\t%s\n' "$label" "$versioned_id" "$latest_id" >> dist/worker-template/s3-version-ids.tsv
          }

          put_pair worker_yaml dist/worker-template/worker.yaml '' 'application/x-yaml'
          put_pair worker_yaml_sha256 dist/worker-template/worker.yaml.sha256 '.sha256' 'text/plain'
          put_pair worker_yaml_cosign_bundle dist/worker-template/worker.yaml.cosign.bundle '.cosign.bundle' 'application/vnd.dev.sigstore.bundle+json'
          put_pair worker_yaml_sig dist/worker-template/worker.yaml.sig '.sig' 'text/plain'
          put_pair worker_yaml_cert dist/worker-template/worker.yaml.cert '.cert' 'application/pem-certificate-chain'

          worker_version_id="$(awk '$1 == "worker_yaml" { print $2 }' dist/worker-template/s3-version-ids.tsv)"
          echo "worker_version_id=${worker_version_id}" >> "$GITHUB_OUTPUT"

      - name: Emit worker template manifest
        env:
          TAG: ${{ needs.release-tag.outputs.tag }}
          TEMPLATE_TAG: ${{ needs.release-tag.outputs.template_tag }}
          PUSHED: ${{ needs.release-tag.outputs.push }}
          PUBLISHED_TO_S3: ${{ needs.release-tag.outputs.push == 'true' && needs.release-tag.outputs.publish_template_to_s3 == 'true' }}
          TEMPLATE_SHA256: ${{ steps.stage-template.outputs.sha256 }}
          VERSIONED_KEY: ${{ steps.stage-template.outputs.versioned_key }}
          LATEST_KEY: ${{ steps.stage-template.outputs.latest_key }}
          S3_URL: ${{ steps.stage-template.outputs.s3_url }}
          MIRROR_URL: ${{ steps.stage-template.outputs.mirror_url }}
          WORKER_VERSION_ID: ${{ steps.publish-template.outputs.worker_version_id }}
        run: |
          set -euo pipefail
          s3_url_with_version_json="null"
          worker_version_id_json="null"
          if [ -n "${WORKER_VERSION_ID}" ] && [ "${WORKER_VERSION_ID}" != "None" ]; then
            encoded_version_id="$(WORKER_VERSION_ID="$WORKER_VERSION_ID" python3 -c 'import os, urllib.parse; print(urllib.parse.quote(os.environ["WORKER_VERSION_ID"], safe=""))')"
            s3_url_with_version_json="$(printf '%s?versionId=%s' "$S3_URL" "$encoded_version_id" | jq -R .)"
            worker_version_id_json="$(printf '%s' "$WORKER_VERSION_ID" | jq -R .)"
          fi
          cat > dist/release-manifests/worker-template.json <<JSON
          {
            "schema_version": 1,
            "kind": "cloudformation_template",
            "release_tag": "${TAG}",
            "template_tag": "${TEMPLATE_TAG}",
            "template_bucket": "${TEMPLATE_BUCKET}",
            "template_region": "${AWS_REGION}",
            "versioned_key": "${VERSIONED_KEY}",
            "latest_key": "${LATEST_KEY}",
            "s3_url": "${S3_URL}",
            "s3_url_with_version": ${s3_url_with_version_json},
            "mirror_url": "${MIRROR_URL}",
            "sha256": "${TEMPLATE_SHA256}",
            "signed": ${PUSHED},
            "published_to_s3": ${PUBLISHED_TO_S3},
            "worker_template_version_id": ${worker_version_id_json}
          }
          JSON

      - name: Upload worker template artifact
        uses: actions/upload-artifact@v4
        with:
          name: cluster-a-worker-template
          path: |
            dist/worker-template/*
            dist/release-manifests/worker-template.json
          retention-days: 30

  enclave-eif:
    name: Build Nitro EIF
    runs-on: [self-hosted, linux, x64, nitro-enclaves]
    needs: release-tag
    if: needs.release-tag.outputs.publish_oci_artifacts == 'true' && needs.release-tag.outputs.build_enclave_eif == 'true'
    environment: production-release
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Verify Nitro build tooling
        run: |
          command -v nitro-cli
          command -v docker
          nitro-cli --version
          docker --version
          test -d /usr/share/nitro_enclaves/blobs

      - name: Configure AWS credentials
        if: needs.release-tag.outputs.push == 'true'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_RELEASE_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: cluster-a-eif-release-${{ github.run_id }}

      - name: Login to ECR Public
        if: needs.release-tag.outputs.push == 'true'
        uses: aws-actions/amazon-ecr-login@v2
        with:
          registry-type: public

      - name: Verify ECR Public namespace
        if: needs.release-tag.outputs.push == 'true'
        run: |
          set -euo pipefail
          aliases="$(aws ecr-public describe-registries --query 'registries[].aliases[].name' --output text)"
          printf 'ECR Public aliases: %s\n' "$aliases"
          printf '%s\n' "$aliases" | tr '\t' '\n' | grep -Fx "$ECR_PUBLIC_NAMESPACE" >/dev/null

      - name: Ensure ECR Public repositories exist
        if: needs.release-tag.outputs.push == 'true'
        run: |
          set -euo pipefail
          for repository in enclave-rootfs enclave; do
            if ! aws ecr-public describe-repositories --repository-names "$repository" >/dev/null 2>&1; then
              aws ecr-public create-repository --repository-name "$repository" >/dev/null
            fi
          done

      - name: Restore MiniLM release weights
        run: |
          set -euo pipefail
          MODEL_URL="https://huggingface.co/sentence-transformers/all-MiniLM-L6-v2/resolve/main/model.safetensors"
          MODEL_PATH="test_assets/minilm/model.safetensors"
          MODEL_SHA256="53aa51172d142c89d9012cce15ae4d6cc0ca6895895114379cacb4fab128d9db"

          mkdir -p "$(dirname "$MODEL_PATH")"
          curl --fail --location --retry 3 --retry-delay 5 \
            --output "$MODEL_PATH" \
            "$MODEL_URL"

          actual_sha256="$(sha256sum "$MODEL_PATH" | awk '{print $1}')"
          if [ "$actual_sha256" != "$MODEL_SHA256" ]; then
            printf 'MiniLM model SHA-256 mismatch: expected %s, got %s\n' \
              "$MODEL_SHA256" \
              "$actual_sha256" >&2
            exit 1
          fi

      - name: Build enclave rootfs image
        env:
          TAG: ${{ needs.release-tag.outputs.tag }}
        run: |
          set -euo pipefail
          ROOTFS_URI="${ECR_PUBLIC_REGISTRY}/${ECR_PUBLIC_NAMESPACE}/enclave-rootfs:${TAG}"
          docker buildx build \
            --load \
            --build-context minilm=./test_assets/minilm \
            -f deploy/release/images/Dockerfile.enclave \
            -t "$ROOTFS_URI" \
            .
          echo "ROOTFS_URI=$ROOTFS_URI" >> "$GITHUB_ENV"

      - name: Install cosign
        if: needs.release-tag.outputs.push == 'true'
        uses: sigstore/cosign-installer@v3
        with:
          cosign-release: 'v2.4.1'

      - name: Push and sign enclave rootfs image
        if: needs.release-tag.outputs.push == 'true'
        run: |
          set -euo pipefail
          docker push "$ROOTFS_URI"
          DIGEST="$(docker inspect --format='{{index .RepoDigests 0}}' "$ROOTFS_URI")"
          echo "ROOTFS_DIGEST=$DIGEST" >> "$GITHUB_ENV"
          cosign sign --yes "$DIGEST"

      - name: Build EIF and extract measurements
        env:
          TAG: ${{ needs.release-tag.outputs.tag }}
          NITRO_CLI_BLOBS: /usr/share/nitro_enclaves/blobs
          NITRO_CLI_ARTIFACTS: /tmp/nitro-cli-artifacts
        run: |
          set -euo pipefail
          mkdir -p dist "$NITRO_CLI_ARTIFACTS"
          sudo env \
            NITRO_CLI_BLOBS="$NITRO_CLI_BLOBS" \
            NITRO_CLI_ARTIFACTS="$NITRO_CLI_ARTIFACTS" \
            nitro-cli build-enclave \
            --docker-uri "$ROOTFS_URI" \
            --output-file dist/cyntrisec-enclave.eif \
            | tee dist/nitro-build-output.json
          sudo chown "$(id -u):$(id -g)" dist/cyntrisec-enclave.eif
          python3 scripts/release/nitro_measurements_manifest.py \
            --nitro-output dist/nitro-build-output.json \
            --eif dist/cyntrisec-enclave.eif \
            --release-tag "$TAG" \
            --rootfs-image "$ROOTFS_URI" \
            --eif-oci-ref "${ECR_PUBLIC_REGISTRY}/${ECR_PUBLIC_NAMESPACE}/enclave:${TAG}" \
            --out dist/enclave-measurements.json
          cat dist/enclave-measurements.json

      - name: Install ORAS
        if: needs.release-tag.outputs.push == 'true'
        uses: oras-project/setup-oras@v1

      - name: Sign EIF blob and push EIF OCI artifact
        if: needs.release-tag.outputs.push == 'true'
        env:
          TAG: ${{ needs.release-tag.outputs.tag }}
          EIF_REF: ${{ env.ECR_PUBLIC_REGISTRY }}/${{ env.ECR_PUBLIC_NAMESPACE }}/enclave:${{ needs.release-tag.outputs.tag }}
        run: |
          set -euo pipefail
          cosign sign-blob \
            --yes \
            --bundle dist/cyntrisec-enclave.eif.cosign.bundle \
            --output-signature dist/cyntrisec-enclave.eif.sig \
            --output-certificate dist/cyntrisec-enclave.eif.cert \
            dist/cyntrisec-enclave.eif
          oras push "$EIF_REF" \
            dist/cyntrisec-enclave.eif:application/vnd.cyntrisec.eif \
            dist/enclave-measurements.json:application/vnd.cyntrisec.measurements+json \
            dist/cyntrisec-enclave.eif.sig:application/vnd.dev.sigstore.bundle.signature \
            dist/cyntrisec-enclave.eif.cert:application/pem-certificate-chain \
            dist/cyntrisec-enclave.eif.cosign.bundle:application/vnd.dev.sigstore.bundle+json
          EIF_DIGEST="$(oras resolve "$EIF_REF")"
          echo "$EIF_REF@$EIF_DIGEST" > dist/enclave-oci-ref.txt
          cosign sign --yes "$EIF_REF@$EIF_DIGEST"

      - name: Upload EIF release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: cluster-a-enclave-eif
          path: |
            dist/cyntrisec-enclave.eif
            dist/enclave-measurements.json
            dist/nitro-build-output.json
            dist/enclave-oci-ref.txt
            dist/cyntrisec-enclave.eif.*
          retention-days: 30

  release-summary:
    name: Release Summary
    runs-on: ubuntu-22.04
    needs: [release-tag, host-binaries, proxy-image, worker-template, enclave-eif]
    if: always() && needs.worker-template.result == 'success' && (needs.release-tag.outputs.publish_oci_artifacts != 'true' || (needs.host-binaries.result == 'success' && needs.proxy-image.result == 'success'))
    steps:
      - name: Download host binary manifests
        if: needs.release-tag.outputs.publish_oci_artifacts == 'true'
        uses: actions/download-artifact@v4
        with:
          pattern: cluster-a-host-binary-*
          path: release-manifests
          merge-multiple: true

      - name: Download image manifests
        if: needs.release-tag.outputs.publish_oci_artifacts == 'true'
        uses: actions/download-artifact@v4
        with:
          pattern: cluster-a-image-*
          path: release-manifests
          merge-multiple: true

      - name: Download worker template artifact
        uses: actions/download-artifact@v4
        with:
          name: cluster-a-worker-template
          path: release-manifests

      - name: Download enclave measurements
        if: needs.enclave-eif.result == 'success'
        uses: actions/download-artifact@v4
        with:
          name: cluster-a-enclave-eif
          path: enclave

      - name: Write summary
        run: |
          echo "## Cluster A Image Release" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Tag: \`${{ needs.release-tag.outputs.tag }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "Template tag: \`${{ needs.release-tag.outputs.template_tag }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "Pushed: \`${{ needs.release-tag.outputs.push }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "### Release Artifacts" >> "$GITHUB_STEP_SUMMARY"
          find release-manifests -name '*.json' -print | sort | while read -r f; do
            echo "\`\`\`json" >> "$GITHUB_STEP_SUMMARY"
            cat "$f" >> "$GITHUB_STEP_SUMMARY"
            echo "\`\`\`" >> "$GITHUB_STEP_SUMMARY"
          done
          if [ -f enclave/enclave-measurements.json ]; then
            echo "### Enclave Measurements" >> "$GITHUB_STEP_SUMMARY"
            echo "\`\`\`json" >> "$GITHUB_STEP_SUMMARY"
            cat enclave/enclave-measurements.json >> "$GITHUB_STEP_SUMMARY"
            echo "\`\`\`" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "### Enclave Measurements" >> "$GITHUB_STEP_SUMMARY"
            echo "EIF build skipped. Re-run with \`build_enclave_eif=true\` on a Nitro self-hosted runner." >> "$GITHUB_STEP_SUMMARY"
          fi
